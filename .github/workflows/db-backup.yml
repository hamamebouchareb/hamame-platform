name: Nightly DB Backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_BACKUP_URL
        env:
          SUPABASE_BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
        run: |
          if [ -z "$SUPABASE_BACKUP_URL" ]; then
            echo "SUPABASE_BACKUP_URL secret is not set" >&2
            exit 1
          fi

      - name: Dump Supabase PostgreSQL database
        env:
          SUPABASE_BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
        run: |
          STAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          mkdir -p "$RUNNER_TEMP/backups"
          docker run --rm \
            -e DATABASE_URL="$SUPABASE_BACKUP_URL" \
            -v "$RUNNER_TEMP/backups:/backups" \
            postgres:17-alpine \
            pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="/backups/hamame-db-${STAMP}.dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamame-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backups/*.dump
          retention-days: 14
