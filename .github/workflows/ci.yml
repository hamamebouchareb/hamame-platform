name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: checkout only.
permissions:
  contents: read

# No secrets, no database access in any job. Backend typecheck/build runs
# `prisma generate` (client codegen from schema.prisma only — no DB
# connection) and `tsc`; the web job builds with a dummy API address so no
# live backend is needed. The Playwright smoke is deliberately NOT in CI
# (it needs real servers + a database).
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
